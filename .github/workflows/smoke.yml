name: Smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py scheduler.py growth_engine.py learner.py planner.py writer.py storage.py metadata.py gpu_manager.py self_improvement.py production_pipeline.py guest_manager.py guest_visual.py runtime_control.py webapp.py studio/__init__.py studio/models.py studio/prompts.py studio/asset_store.py studio/image_generator.py studio/video_generator.py web_launcher.pyw restart_helper.pyw video/renderer.py youtube/uploader.py youtube/analytics.py
      - name: PowerShell syntax check
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw automation/windows_cycle.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw automation/install_windows_task.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw automation/remove_windows_task.ps1)) | Out-Null
      - run: python main.py --show
        env:
          POSTS_PER_DAY: "3"
          DRY_RUN: "true"
