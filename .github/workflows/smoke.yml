name: Smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py scheduler.py growth_engine.py learner.py planner.py writer.py storage.py youtube/analytics.py
      - run: python main.py --show
        env:
          POSTS_PER_DAY: "3"
          DRY_RUN: "true"
