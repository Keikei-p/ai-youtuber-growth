name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg for media integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - name: Check mobile controller source
        run: |
          node --check mobile/www/app.js
          python -m json.tool mobile/package.json > /dev/null
          python -m json.tool mobile/capacitor.config.json > /dev/null
      - name: Check Native Model Lab status
        run: python native_model_lab.py --status
      - name: PowerShell syntax check
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw automation/windows_cycle.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw automation/install_windows_task.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw automation/remove_windows_task.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw automation/windows_task_status.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw automation/remote_access_enable.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw automation/remote_access_disable.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw automation/remote_access_status.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw packaging/build_windows.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw packaging/build_release.ps1)) | Out-Null
      - run: python main.py --show
        env:
          POSTS_PER_DAY: "3"
          DRY_RUN: "true"


  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure FFmpeg on Windows
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version
          ffprobe -version
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Compile all Python on Windows
        run: python -m compileall -q .
      - name: Run all tests on Windows
        run: python -m unittest discover -s tests -v
      - name: Check mobile controller source
        shell: pwsh
        run: |
          node --check mobile/www/app.js
          python -m json.tool mobile/package.json | Out-Null
          python -m json.tool mobile/capacitor.config.json | Out-Null
      - name: Check Native Model Lab status
        run: python native_model_lab.py --status
      - name: Validate Windows automation scripts
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw automation/windows_cycle.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw automation/install_windows_task.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw automation/remove_windows_task.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw automation/windows_task_status.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw automation/remote_access_enable.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw automation/remote_access_disable.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw automation/remote_access_status.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw packaging/build_windows.ps1)) | Out-Null

          if (-not (Get-Command schtasks.exe -ErrorAction SilentlyContinue)) {
            throw "schtasks.exe is unavailable"
          }
          if (-not (Get-Command powercfg.exe -ErrorAction SilentlyContinue)) {
            throw "powercfg.exe is unavailable"
          }

          $action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-NoProfile -Command exit 0"
          $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddHours(1)
          $settings = New-ScheduledTaskSettingsSet -WakeToRun -StartWhenAvailable -MultipleInstances IgnoreNew
          $task = New-ScheduledTask -Action $action -Trigger $trigger -Settings $settings
          if (-not $task.Settings.WakeToRun) {
            throw "WakeToRun was not preserved in the scheduled-task definition"
          }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File automation/install_windows_task.ps1 -IntervalMinutes 60 -DryRun
          if ($LASTEXITCODE -ne 0) {
            throw "install_windows_task.ps1 DryRun failed"
          }
      - name: Import dashboard and run dry-run state command
        shell: pwsh
        env:
          POSTS_PER_DAY: "3"
          DRY_RUN: "true"
        run: |
          python -c "import webapp; print('webapp import ok')"
          python main.py --show

  windows-package-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaging tools
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
      - name: Build real Windows distributables
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/build_release.ps1 -Version "0.12.0-ci"
      - name: Verify installer, portable zip and hashes
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw dist/release/release-manifest.json | ConvertFrom-Json
          $expected = @(
            "MiraiProductionOS-0.12.0-ci-Setup.exe",
            "MiraiProductionOS-0.12.0-ci-Portable.zip"
          )
          foreach ($name in $expected) {
            $path = Join-Path "dist/release" $name
            if (-not (Test-Path $path)) { throw "missing artifact: $name" }
            if (-not (Test-Path ($path + ".sha256"))) { throw "missing hash: $name" }
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            $entry = $manifest.artifacts.$name
            if (-not $entry) { throw "manifest entry missing: $name" }
            if ($actual -ne $entry.sha256) { throw "hash mismatch: $name" }
          }
      - name: Install launch uninstall lifecycle smoke
        shell: pwsh
        run: |
          $installer = Resolve-Path "dist/release/MiraiProductionOS-0.12.0-ci-Setup.exe"
          $installRoot = Join-Path $env:RUNNER_TEMP "MiraiInstalled"
          $userRoot = Join-Path $env:LOCALAPPDATA "YOROKOBI\MiraiProductionOS"
          New-Item -ItemType Directory -Force -Path $userRoot | Out-Null
          $sentinel = Join-Path $userRoot "ci-preserve-test.txt"
          "preserve-me" | Set-Content -Encoding ascii -Path $sentinel

          $install = Start-Process -FilePath $installer -ArgumentList @(
            "/S",
            "/D=$installRoot"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "silent installer failed: $($install.ExitCode)"
          }

          $appExe = Join-Path $installRoot "MiraiProductionOS.exe"
          if (-not (Test-Path $appExe)) {
            throw "installed executable missing: $appExe"
          }

          $env:MIRAI_USER_DATA_ROOT = Join-Path $env:RUNNER_TEMP "mirai-runtime-smoke"
          $process = Start-Process -FilePath $appExe -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "installed executable exited during startup smoke: $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue

          $uninstaller = Join-Path $installRoot "Uninstall.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "uninstaller missing: $uninstaller"
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "silent uninstall failed: $($uninstall.ExitCode)"
          }
          Start-Sleep -Seconds 2

          if (Test-Path $installRoot) {
            $remaining = Get-ChildItem -Force $installRoot -ErrorAction SilentlyContinue
            if ($remaining) {
              throw "install directory still contains files after uninstall"
            }
          }
          if (-not (Test-Path $sentinel)) {
            throw "user data was removed by uninstall"
          }
          if ((Get-Content -Raw $sentinel).Trim() -ne "preserve-me") {
            throw "user data was modified by uninstall"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: mirai-windows-package-smoke
          path: dist/release/*
          if-no-files-found: error

