name: Smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - name: PowerShell syntax check
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw automation/windows_cycle.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw automation/install_windows_task.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw automation/remove_windows_task.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw automation/windows_task_status.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw automation/remote_access_enable.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw automation/remote_access_disable.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw automation/remote_access_status.ps1)) | Out-Null
      - run: python main.py --show
        env:
          POSTS_PER_DAY: "3"
          DRY_RUN: "true"
