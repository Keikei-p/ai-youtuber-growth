name: Windows wake-task PowerShell validation

on:
  pull_request:
    paths:
      - 'automation/install_windows_task.ps1'
      - 'automation/windows_cycle.ps1'
      - 'automation/hidden_task_runner.vbs'
      - '.github/workflows/windows-wake-task-validation.yml'
  push:
    branches: [main]
    paths:
      - 'automation/install_windows_task.ps1'
      - 'automation/windows_cycle.ps1'
      - 'automation/hidden_task_runner.vbs'
      - '.github/workflows/windows-wake-task-validation.yml'

jobs:
  validate-wake-task:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse wake-task script in Windows PowerShell 5.1
        shell: powershell
        run: |
          $scriptPath = Join-Path $PWD 'automation\install_windows_task.ps1'
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath, [ref]$tokens, [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host 'PowerShell 5.1 syntax: OK'

      - name: Parse both automation PowerShell scripts
        shell: powershell
        run: |
          foreach ($file in @('automation/install_windows_task.ps1', 'automation/windows_cycle.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.ToString() }
              exit 1
            }
          }

      - name: Validate hidden runner propagates failure and writes logs
        shell: powershell
        run: |
          $launcher = (Resolve-Path ".\automation\hidden_task_runner.vbs").Path
          $child = Start-Process -FilePath "$env:WINDIR\System32\wscript.exe" -ArgumentList ('//B //Nologo "' + $launcher + '" /selftest') -Wait -PassThru
          if ($child.ExitCode -ne 7) { throw "Hidden launcher did not propagate error code 7: $($child.ExitCode)" }
          $launcherLog = Get-ChildItem "logs/automation-launcher-*.log" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $launcherLog -or -not (Select-String -Path $launcherLog.FullName -Pattern "END child exit_code=7")) {
            throw "Hidden launcher failed to log child error"
          }

      - name: Dry-run wake task creation without registering task
        shell: powershell
        run: |
          & .\automation\install_windows_task.ps1 -DryRun
