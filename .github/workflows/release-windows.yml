name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version (example: 0.12.0-beta)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          ffmpeg -version
          $nsis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $nsis) {
            $candidate = "C:\Program Files (x86)\NSIS\makensis.exe"
            if (-not (Test-Path $candidate)) { throw 'makensis.exe is unavailable' }
          }
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if (-not $version) {
            if ('${{ github.ref_type }}' -eq 'tag') {
              $version = '${{ github.ref_name }}'.TrimStart('v')
            } else {
              $version = python -c "from product_core import PRODUCT_VERSION; print(PRODUCT_VERSION)"
            }
          }
          $version = $version.Trim()
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build distributables
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/build_release.ps1 -Version "${{ steps.version.outputs.value }}"
      - name: Verify release manifest and artifacts
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw dist/release/release-manifest.json | ConvertFrom-Json
          if (-not $manifest.artifacts) { throw 'release manifest has no artifacts' }
          Get-ChildItem dist/release | Format-Table Name,Length
          foreach ($entry in $manifest.artifacts.PSObject.Properties) {
            $path = Join-Path 'dist/release' $entry.Name
            if (-not (Test-Path $path)) { throw ('missing artifact: ' + $entry.Name) }
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value.sha256) { throw ('hash mismatch: ' + $entry.Name) }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: "MiraiProductionOS-${{ steps.version.outputs.value }}-windows"
          path: dist/release/*
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/release/* --title "Mirai Production OS ${{ steps.version.outputs.value }}" --generate-notes
