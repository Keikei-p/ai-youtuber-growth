<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Mirai</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header><div class="orb" aria-hidden="true"></div><div><p class="eyebrow">MIRAI PRODUCTION OS</p><h1>ミライ</h1><p class="muted">完全自動YouTube運用コントローラー</p></div></header>
    <section id="setupCard" class="card">
      <p class="eyebrow">初回接続</p><h2>PC / Cloudのミライへ接続</h2>
      <label>接続URL<input id="baseUrl" inputmode="url" autocomplete="url" placeholder="https://xxxx.ts.net"></label>
      <label>接続コード<input id="token" type="password" autocomplete="off" placeholder="PCで発行したコード"></label>
      <button id="saveConnection" class="primary">接続して保存</button>
      <p class="hint">Tailscale等のHTTPS URLを推奨。接続コードはこの端末内だけに保存します。</p>
    </section>
    <section id="dashboard" hidden>
      <section class="hero-card card"><div><p class="eyebrow">AUTOPILOT</p><h2 id="autopilotTitle">確認中…</h2><p id="autopilotDetail" class="muted"></p></div><button id="autopilotButton" class="primary">完全自動運用開始</button></section>
      <div class="stats">
        <section class="card mini"><span>次の投稿</span><strong id="nextPost">-</strong><small id="nextPostTitle"></small></section>
        <section class="card mini"><span>直近投稿</span><strong id="lastPost">-</strong><small id="lastPostDetail"></small></section>
      </div>
      <section class="card"><div class="row"><div><p class="eyebrow">STATUS</p><h2>運用状態</h2></div><button id="refreshButton" class="ghost">更新</button></div><div id="problems"></div><button id="dueButton" class="ghost wide">今すぐ投稿判定</button></section>
      <section class="card"><div class="row"><div><p class="eyebrow">CONNECTION</p><h2>接続設定</h2></div><button id="disconnectButton" class="danger">解除</button></div><p id="connectionLabel" class="muted"></p></section>
    </section>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="./app.js"></script>
</body>
</html>
